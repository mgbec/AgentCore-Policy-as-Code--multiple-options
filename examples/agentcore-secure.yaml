AWSTemplateFormatVersion: "2010-09-09"
Description: Compliant AgentCore Runtime. Should pass all cfn-guard rules.

Resources:
  SecureAgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: secure_agent
      Description: Example runtime with hardened settings
      RoleArn: arn:aws:iam::123456789012:role/AgentCoreRuntimeRole
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-agent:1.2.3
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: https://example.auth.us-east-1.amazoncognito.com/.well-known/openid-configuration
          AllowedClients:
            - my-client-id
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets:
            - subnet-0123456789abcdef0
          SecurityGroups:
            - sg-0123456789abcdef0
      EnvironmentVariables:
        LOG_LEVEL: info
